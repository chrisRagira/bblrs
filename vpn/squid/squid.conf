# =============================================================================
# Squid 6 — ProxyAaS
# ORDER MATTERS in Squid 6: auth_param must come before external_acl_type
# =============================================================================

http_port 3128

# ── 1. Basic auth FIRST — Squid 6 requires this before external_acl_type ─────
auth_param basic program /usr/local/bin/fake-auth-helper.sh
auth_param basic realm "ProxyAaS"
auth_param basic credentialsttl 2 minutes
auth_param basic casesensitive off

# ── 2. External ACL SECOND — uses %LOGIN populated by basic auth above ────────
external_acl_type apikey_auth \
    ttl=60 negative_ttl=5 \
    children-max=10 children-startup=2 children-idle=1 \
    concurrency=0 \
    children=10 \
    protocol=2.5 \
    %LOGIN \
    /usr/local/bin/squid-auth-helper.sh

# ── 3. ACL definitions ────────────────────────────────────────────────────────
acl authenticated proxy_auth REQUIRED
acl valid_key      external  apikey_auth
acl SSL_ports      port 443
acl Safe_ports     port 80 443 8080 21 70 210 1025-65535
acl CONNECT        method CONNECT

# ── 4. Access rules ───────────────────────────────────────────────────────────
http_access deny  !Safe_ports
http_access deny  CONNECT !SSL_ports
http_access deny  !authenticated
http_access allow authenticated valid_key
http_access deny  all

# ── Privacy ───────────────────────────────────────────────────────────────────
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Proxy-Authorization deny all

# ── Cache ─────────────────────────────────────────────────────────────────────
cache_mem 128 MB
cache_dir ufs /var/spool/squid 4096 16 256
maximum_object_size 64 MB

# ── Logging ───────────────────────────────────────────────────────────────────
access_log stdio:/var/log/squid/access.log squid
cache_log  stdio:/var/log/squid/cache.log

# ── DNS ───────────────────────────────────────────────────────────────────────
dns_nameservers 8.8.8.8 1.1.1.1