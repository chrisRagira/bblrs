server {
    listen 80;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:4000/health;
    }

    location / {
        return 200 'ProxyAaS dev server';
        add_header Content-Type text/plain;
    }
}